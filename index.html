<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My GitHub Pages Demo</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-strong: #3b82f6;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827 55%, #1e293b);
        color: var(--text);
        display: grid;
        place-items: center;
      }

      .container {
        width: min(860px, calc(100% - 32px));
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 20px;
        padding: 48px 32px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.5);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.35);
        color: #bfdbfe;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 20px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
      }

      .button.secondary {
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(148, 163, 184, 0.03);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="badge">GitHub Pages</div>
        <h1>Hello, GitHub Pages!</h1>
        <p>
          这是一个最小可用的 GitHub Pages 示例站点。你可以在这个仓库中继续添加自己的内容，
          例如产品介绍、项目文档、个人博客或作品集页。
        </p>
        <div class="actions">
          <a class="button primary" href="https://github.com/aicode915/demo-pages-site">查看仓库</a>
          <a class="button secondary" href="https://aicode915.github.io/demo-pages-site">访问站点</a>
        </div>
      </div>
    </div>
  </body>
</html>
